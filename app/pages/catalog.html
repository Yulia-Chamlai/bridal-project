<main class="main">
  <section class="catalog">
    <div class="container">
      <!--=include breadcrumbs.html-->
      <div class="catalog__top">
        <div class="catalog__top-mode mode">
          <p class="mode__text">View as</p>
          <button class="mode__btn-grid" type="button">
            <svg width="20" height="20">
                    <use xlink:href="images/sprite.svg#grid-mode-icon">
                    </use>
                </svg>
          </button>
          <button class="mode__btn-line" type="button">
            <svg width="20" height="20">
                    <use xlink:href="images/sprite.svg#line-mode-icon">
                    </use>
                </svg>
          </button>
        </div>
        <h2 class="catalog__top-title section-title">WEDDING DRESSES</h2>
        <form class="catalog__top-form sort-form">
          <select class="sort-form__select">
             <option value="Sort by popularity">Sort by popularity</option>
             <option value="Sort by price">Sort by price</option>
            <option value="Sort by designer">Sort by designer</option>            
          </select>
        </form>
      </div>
      <div class="catalog__content">
        <div class="catalog__content-wrapper">
          <aside class="catalog__content-filter catalog-filter">

              <div class="catalog-filter__box">
                <div class="catalog-filter__item item-price">
                  <p class="item-price__title catalog-filter__item-title">PRICE</p>
                  <div class="item-price__range range">
                    <div class="range__input-box">
                      <label class="range__label">
                        <input class="range__min range__input" placeholder="300" type="number" min="300" max="3000" step="100">
                      </label>-
                      <label class="range__label">
                        <input class="range__max range__input" placeholder="3000" type="number" min="300" max="3000" step="100">
                      </label>
                    </div>
                  </div>
                  <div class="range__slider"></div>
                  <ul class="range__list">
                    <li class="range__number">300</li>
                    <li class="range__number">1,000</li>
                    <li class="range__number">1,500</li>
                    <li class="range__number">2,000</li>
                    <li class="range__number">2,500</li>
                    <li class="range__number">3,000</li>
                  </ul>
                </div>
                <div class="catalog-filter__item item-size">
                  <p class="item-size__title catalog-filter__item-title">SIZE</p>
                  <div class="item-size__list">
                    <label class="item-size__label checkbox-label">
                      <input class="item-size__input checkbox-box" type="checkbox">
                        <span class="checkbox-style"></span>
                    XS
                    </label>
                    <label class="item-size__label checkbox-label">
                      <input class="item-size__input checkbox-box" type="checkbox">
                        <span class="checkbox-style"></span>
                    S
                    </label>
                    <label class="item-size__label checkbox-label">

                        <span class="checkbox-style"></span>

                    <label class="item-size__label checkbox-label">

                    </label>
                    <label class="item-size__label checkbox-label">

                        <span class="checkbox-style"></span>
                    XL
                    </label>
                    <label class="item-size__label checkbox-label">
                      <input class="item-size__input checkbox-box" type="checkbox">
                        <span class="checkbox-style"></span>
                    XXL
                    </label>
                  </div>
                </div>
                <div class="catalog-filter__item item-color">

                  <div class="item-style__list">
                    <label class="item-style__label checkbox-label">

                    <label class="item-style__label checkbox-label">

                    <label class="item-style__label checkbox-label">
                       <input class="item-style__input checkbox-box" type="checkbox">
                        <span class="checkbox-style"></span>
                    ELOPEMENT
                    </label>
                  </div>
                </div>
                <button class="catalog-filter__btn" type="reset">CLEAN ALL</button>
              </div>
