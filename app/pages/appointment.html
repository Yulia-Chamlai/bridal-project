<main class="main">
  <section class="appointment">
    <div class="container">
      <h2 class="appointment__title section-title">BOOK AN APPOINTMENT</h2>
      <div class="appointment__inner">
        <div class="appointment__content">
          <p class="appointment__content-title">CONTACT INFORMATHION</p>
          <p class="appointment__content-text">Fill in your contact details</p>
          <form class="appointment__content-form">
            <input class="appointment__content-input" type="text" placeholder="First name">
            <input class="appointment__content-input" type="text" placeholder="Last name">
            <input class="appointment__content-input" type="email" placeholder="Email">
            <input class="appointment__content-input" type="tel" placeholder="Mobile">
          </form>
          <button class="appointment__content-btn" type="submit">SEND</button>
        </div>
        <div class="appointment__img">
          <picture>
          <source srcset="images/appointment-img.avif" type="image/avif">
          <source srcset="images/appointment-img.webp" type="image/webp">
          <img src="images/appointment-img.jpg" width="540" height="689" alt="girl in wedding dress looking in the window">
          </picture>
        </div>
      </div>
    </div>
  </section>
</main>
<!--=include footer.html-->
