<section class="join-us">
  <div class="container">
    <div class="join-us__inner">
      <picture class="join-us__img">
      <source srcset="../images/join-us-img.avif" type="image/avif">
      <source srcset="../images/join-us-img.webp" type="image/webp">
      <img src="../images/join-us-img.jpg" width="540" height="489" alt="girl looking back in wedding dress">
      </picture>
      <div class="join-us__content">
        <h2 class="join-us__title section-title">JOIN US</h2>
        <p class="join-us__text">Sign up and get 10% discount on your first purchase!</p>
        <form class="join-us__form">
          <input class="join-us__input" type="text" placeholder="First Name">
          <input class="join-us__input" type="email" placeholder="Email">
        </form>
        <button class="join-us__btn" type="submit">GET 10%</button>
        <p class="join-us__subtext">*By compleating this form you are signing up to receive our emails and can unsubscribe at any time.</p>
      </div>
    </div>
  </div>
</section>
